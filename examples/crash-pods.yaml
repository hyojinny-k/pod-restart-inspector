# 재현용 테스트 Pod 2개: 일정 주기로 죽는 컨테이너 + 메모리 초과로 OOMKilled 되는 컨테이너
apiVersion: v1
kind: Pod
metadata:
  name: crasher
  namespace: default
spec:
  restartPolicy: Always
  containers:
    - name: crasher
      image: busybox:1.36
      command: ["sh", "-c", "echo start; sleep 20; exit 1"]
---
apiVersion: v1
kind: Pod
metadata:
  name: oom-test
  namespace: default
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: python:3.12-alpine
      # 64Mi 제한 컨테이너에서 200MB를 할당해 OOMKilled 유도
      command: ["python", "-c", "x = bytearray(200 * 1024 * 1024); import time; time.sleep(60)"]
      resources:
        limits:
          memory: "64Mi"
